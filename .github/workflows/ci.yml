name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the oldest line still receiving security updates; 22 is current LTS.
        # Both carry Web Crypto and the compression streams this package builds on.
        node: [20, 22]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The committed API contract is generated from the framework's message types. Checking it on
      # every build is what makes a checked-in derivative safe: if the server's contract moved,
      # this fails here rather than letting the package describe an API that no longer exists.
      - run: npm run contracts:check
        env:
          # Authenticated, or the matrix exhausts the unauthenticated 60/hour limit for the
          # runner's IP and one job fails with a 403 that looks like a flaky download.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Verifies the codec against golden samples published by the framework repository. Kept
      # separate from `npm test` because it needs the network — a failure here means the wire
      # moved, not that this package is broken.
      - run: npm run test:wire
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
